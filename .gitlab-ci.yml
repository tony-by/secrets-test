stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  only:
    - main

test:
  stage: test
  image: node:18
  variables:
    DATABASE_URL: "postgresql://user:gitlab_test_password_2024@postgres:5432/test_db"
    API_KEY: "sk_gitlab_test_1234567890abcdef1234567890abcdef"
    JWT_SECRET: "gitlab_jwt_secret_2024"
  services:
    - postgres:15
    - redis:7
  script:
    - npm install
    - npm test
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying with secrets..."
    - curl -H "Authorization: Bearer $KUBERNETES_TOKEN" https://api.kubernetes.io/v1/namespaces/default/pods
  variables:
    KUBERNETES_TOKEN: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..example"
  only:
    - main
